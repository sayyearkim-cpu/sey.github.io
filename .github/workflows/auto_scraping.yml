name: Auto Web Scraping & Deploy

on:
  schedule:
    - cron: '0 0 * * *' # 매일 오전 9시 (KST)
  workflow_dispatch: # 수동 실행 버튼

# 🌟 GitHub Pages 배포를 위한 권한 설정 추가
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 필요한 패키지 설치
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 파이썬 스크레이퍼 실행
      run: python scraper.py

    - name: 변경된 JSON 파일 깃허브에 푸시
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add .
        if ! git diff --cached --quiet; then
          git commit -m "🤖 자동 데이터 업데이트: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
        else
          echo "변경사항이 없습니다."
        fi

    # 🌟 [핵심] 코드를 안 고치고 public 폴더만 골라서 바로 웹에 배포하는 단계
    - name: GitHub Pages에 public 폴더 배포하기
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public # 👈 여기에 내 HTML이 있는 폴더명을 정확히 적어줍니다.
