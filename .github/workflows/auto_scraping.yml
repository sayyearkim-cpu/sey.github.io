name: Auto Web Scraping & Deploy

on:
  schedule:
    # 🌟 주기 설정 (분 시 일 월 요일 - UTC 기준)
    # 아래 설정은 한국 시간(KST)으로 매일 오전 9시에 실행됩니다. (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 언제든 수동으로 실행하고 싶을 때 쓰는 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 필요한 패키지 설치
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 파이썬 스크레이퍼 실행
      run: python scraper.py

    - name: 변경된 JSON 파일 저장 및 깃허브에 푸시
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        # data.json 파일이 변경되었다면 스테이징 (경로에 맞게 수정 가능)
        git add data.json || git add public/data.json || true 
        
        # 변경사항이 있을 때만 커밋 및 푸시 진행
        if ! git diff --cached --quiet; then
          git commit -m "🤖 자동 데이터 업데이트: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
        else
          echo "변경사항이 없습니다."
        fi
