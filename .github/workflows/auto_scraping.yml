name: Auto Web Scraping & Deploy

on:
  schedule:
    - cron: '0 0 * * *' # 매일 오전 9시 (KST)
  workflow_dispatch: # 수동 실행 버튼

# GitHub Actions 배포와 저장소 쓰기를 위한 권한 설정
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 필요한 패키지 설치
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 파이썬 스크레이퍼 실행
      run: python scraper.py

    - name: 변경된 JSON 파일 저장소에 반영 (Push)
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add .
        if ! git diff --cached --quiet; then
          git commit -m "🤖 자동 데이터 업데이트: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
        else
          echo "변경사항이 없습니다."
        fi

    # 🌟 [핵심] public 폴더만 쏙 골라서 깃허브 배포 서버로 업로드
    - name: public 폴더를 웹 배포 파일로 패키징
      uses: actions/upload-pages-artifact@v3
      with:
        path: './public' # 👈 HTML과 JSON 파일이 들어있는 폴더 경로

    # 🌟 깃허브 서버에 최종 배포 명령 내리기
    - name: GitHub Pages 웹사이트 배포 실행
      uses: actions/deploy-pages@v4
